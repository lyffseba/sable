name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: C++ toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      - name: Pixi (Mojo 1.0)
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          manifest-path: pixi.toml
          cache: true

      - name: Checks
        run: pixi run ci
