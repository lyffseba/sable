name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to publish (e.g. v0.1.1). Required unless this run is already a v*.*.* tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  proto-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              echo "workflow_dispatch needs tag_name (e.g. v0.1.1)" >&2
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Zip proto
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          test -f proto/index.html
          test -f proto/game.js
          test -f proto/style.css
          test -f proto/README.md
          zip -j "sable-proto-${TAG}.zip" \
            proto/index.html proto/game.js proto/style.css proto/README.md
          ls -l "sable-proto-${TAG}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$(printf '%s\n' \
            "Playable Chrome proto." \
            "" \
            "1. Unzip \`sable-proto-${TAG}.zip\`" \
            "2. \`python3 -m http.server 8080 --bind 127.0.0.1\`" \
            "3. Open http://127.0.0.1:8080" \
            "4. Allow camera, tilt it down at your hands, lift the mouse.")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "sable-proto-${TAG}.zip" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "sable-proto-${TAG}.zip" --title "$TAG" --notes "$NOTES"
          fi
