name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to publish (e.g. v0.1.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  proto-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must look like v0.1.1, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: C++ toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake g++

      - name: Pixi (Mojo 1.0)
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          manifest-path: pixi.toml
          cache: true

      - name: Checks
        run: pixi run ci

      - name: Zip proto
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          test -f proto/index.html
          test -f proto/game.js
          test -f proto/style.css
          test -f proto/README.md
          test -f proto/package.json
          test -f proto/vendor/three.module.js
          test -f tools/serve_proto.py
          test -f tools/gemini_muzzle_tracker.py
          (cd proto && zip -r "../sable-proto-${TAG}.zip" index.html game.js style.css README.md package.json vendor/)
          zip -u "sable-proto-${TAG}.zip" -j tools/serve_proto.py tools/gemini_muzzle_tracker.py tools/sable_mojo.py
          sha256sum "sable-proto-${TAG}.zip" | tee "sable-proto-${TAG}.zip.sha256"
          ls -l "sable-proto-${TAG}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Playable Chrome proto. Webcam tracks the physical mouse. Camera is never drawn.

          ## Other computer
          1. Download \`sable-proto-${TAG}.zip\` (private repo — stay logged in as lyffseba).
          2. Unzip, then:

          \`\`\`
          python3 serve_proto.py
          \`\`\`

          3. Open http://127.0.0.1:8080 — allow camera, tilt it down at your hands, lift.

          Or: \`gh release download ${TAG} --repo lyffseba/sable -p 'sable-proto-*.zip'\`
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "sable-proto-${TAG}.zip" "sable-proto-${TAG}.zip.sha256" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "sable-proto-${TAG}.zip" "sable-proto-${TAG}.zip.sha256" \
              --title "$TAG — playable proto" --notes "$NOTES"
          fi
