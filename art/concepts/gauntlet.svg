<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="900" height="420" fill="#0a0c10"/>
  <text x="32" y="36" fill="#59F2C7" font-family="Impact, sans-serif" font-size="18" letter-spacing="6">SABLE  ·  THE CUFF</text>
  <text x="32" y="58" fill="#E6E0D1" font-family="system-ui" font-size="12">Paint sheet. Index mint rail is the muzzle. Rust wrist. Bone plate. No rifle.</text>
  <!-- side -->
  <g transform="translate(80,140)">
    <rect x="0" y="40" width="70" height="46" fill="#8C472E"/>
    <rect x="60" y="28" width="110" height="70" fill="#E6E0D1"/>
    <rect x="70" y="22" width="90" height="12" fill="#59F2C7"/>
    <rect x="165" y="34" width="130" height="18" fill="#59F2C7"/>
    <rect x="165" y="56" width="70" height="14" fill="#141a22"/>
    <rect x="165" y="74" width="58" height="12" fill="#141a22"/>
    <text x="0" y="150" fill="#8aa0b8" font-size="11">SIDE  ·  muzzle →</text>
  </g>
  <!-- top -->
  <g transform="translate(430,150)">
    <rect x="0" y="30" width="60" height="50" fill="#8C472E"/>
    <rect x="50" y="20" width="100" height="70" fill="#E6E0D1"/>
    <rect x="148" y="28" width="120" height="16" fill="#59F2C7"/>
    <rect x="148" y="50" width="80" height="12" fill="#141a22"/>
    <rect x="148" y="66" width="70" height="12" fill="#141a22"/>
    <text x="0" y="130" fill="#8aa0b8" font-size="11">TOP  ·  mint rail = shot origin</text>
  </g>
  <!-- front -->
  <g transform="translate(740,150)">
    <rect x="10" y="20" width="70" height="80" fill="#E6E0D1"/>
    <rect x="28" y="8" width="14" height="100" fill="#59F2C7"/>
    <rect x="10" y="100" width="70" height="18" fill="#8C472E"/>
    <text x="10" y="150" fill="#8aa0b8" font-size="11">FRONT</text>
  </g>
